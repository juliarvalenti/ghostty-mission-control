[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "ghostty-mission-control"
version = "0.1.0"
description = "TUI dashboard for managing Ghostty terminal windows"
requires-python = ">=3.10"
# No external dependencies - stdlib only (curses, subprocess, etc.)
dependencies = []

[project.scripts]
ghostty-mc = "ghostty_mc.__main__:main"
